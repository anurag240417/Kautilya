# Render Blueprint: https://render.com/docs/blueprint-spec
# Dashboard -> New -> Blueprint -> pick this repo. Render builds ./Dockerfile.
#
# This is a hosted PREVIEW of an offline tool, running on synthetic data only.
# There is no login: do not load real or sensitive datasets into a public instance.
services:
  - type: web
    name: kautilya
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free            # 512 MB RAM. Measured peak is ~240 MB at 8,000 tx; use "standard" for larger data.
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # Render injects PORT; backend/main.py listens on it.
      - key: KAUTILYA_HOST
        value: 0.0.0.0
      # Size of the synthetic dataset built at startup and by "Regenerate synthetic data".
      # Keep small on free instances; the default (20000) peaks near 280 MB.
      - key: KAUTILYA_DEFAULT_TX
        value: "8000"
      # Case/feedback database. Ephemeral on free plans: verdicts are lost on restart.
      - key: KAUTILYA_CASE_DB
        value: /app/state/cases.db
